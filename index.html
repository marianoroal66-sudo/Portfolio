<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mi Portfolio de Proyectos</title>
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #f4f6f9;
      color: #333;
      padding: 2rem;
    }

    h1 {
      text-align: center;
      margin-bottom: 2rem;
      color: #1a1a1a;
    }

    /* Loader */
    #loading {
      text-align: center;
      font-size: 1.2rem;
      color: #666;
      margin-top: 3rem;
    }

    /* Rejilla de proyectos (Cards) */
    .projects-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 2rem;
      max-width: 1200px;
      margin: 0 auto;
    }

    /* Estilo del Card */
    .card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .card-title {
      padding: 1rem 1.2rem;
      font-size: 1.25rem;
      font-weight: 600;
      border-bottom: 1px solid #eee;
      background: #fafafa;
    }

    /* Estilo del Carrusel */
    .carousel-container {
      position: relative;
      width: 100%;
      height: 240px;
      background-color: #000;
      overflow: hidden;
    }

    .carousel-slide {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }

    .carousel-slide.active {
      display: block;
    }

    /* Botones de navegación del carrusel */
    .carousel-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(0, 0, 0, 0.5);
      color: white;
      border: none;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 1.2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }

    .carousel-btn:hover {
      background: rgba(0, 0, 0, 0.8);
    }

    .carousel-btn.prev { left: 10px; }
    .carousel-btn.next { right: 10px; }

    /* Indicador de número de foto */
    .carousel-counter {
      position: absolute;
      bottom: 8px;
      right: 12px;
      background: rgba(0, 0, 0, 0.6);
      color: white;
      font-size: 0.75rem;
      padding: 3px 8px;
      border-radius: 10px;
    }
  </style>
</head>
<body>

  <h1>Galería de Proyectos</h1>

  <div id="loading">Cargando proyectos desde Google Drive...</div>
  <div id="projects-container" class="projects-grid"></div>

  <script>
    // SUSTITUYE ESTA URL POR LA URL DE TU DESPLIEGUE DE GOOGLE APPS SCRIPT
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwWXvG0HIVb-P3JC_4Gcc5SX0tGsRerdRHVVdFmn0jb1HBTxjonac8xFYRE35uYWzo/exec";

    async function loadProjects() {
      const container = document.getElementById("projects-container");
      const loading = document.getElementById("loading");

      try {
        const response = await fetch(APPS_SCRIPT_URL);
        const data = await response.json();

        if (data.status !== "success") {
          throw new Error(data.message || "Error al obtener datos");
        }

        loading.style.display = "none";

        // Iterar sobre cada carpeta/proyecto devuelto por el script
        data.projects.forEach((project, index) => {
          if (project.images.length === 0) return; // Omitir carpetas vacías

          const card = document.createElement("div");
          card.className = "card";

          // Generar HTML del carrusel
          let imagesHTML = "";
          project.images.forEach((img, i) => {
            imagesHTML += `<img class="carousel-slide ${i === 0 ? 'active' : ''}" data-index="${i}" src="${img.url}" alt="${img.name}" loading="lazy" />`;
          });

          const showControls = project.images.length > 1;

          card.innerHTML = `
            <div class="carousel-container" id="carousel-${index}">
              ${imagesHTML}
              ${showControls ? `
                <button class="carousel-btn prev" onclick="moveSlide(${index}, -1)">&#10094;</button>
                <button class="carousel-btn next" onclick="moveSlide(${index}, 1)">&#10095;</button>
                <div class="carousel-counter"><span class="current-index">1</span>/${project.images.length}</div>
              ` : ''}
            </div>
            <div class="card-title">${project.projectName}</div>
          `;

          container.appendChild(card);
        });

      } catch (error) {
        console.error(error);
        loading.innerText = "Error cargando las imágenes del portfolio. Revisa la consola o la configuración de Apps Script.";
      }
    }

    // Función para cambiar de imagen en el carrusel de una card específica
    function moveSlide(cardIndex, direction) {
      const container = document.getElementById(`carousel-${cardIndex}`);
      const slides = container.querySelectorAll('.carousel-slide');
      const counter = container.querySelector('.current-index');
      
      let activeIndex = Array.from(slides).findIndex(slide => slide.classList.contains('active'));
      slides[activeIndex].classList.remove('active');

      activeIndex = (activeIndex + direction + slides.length) % slides.length;

      slides[activeIndex].classList.add('active');
      if (counter) counter.innerText = activeIndex + 1;
    }

    // Cargar los proyectos al iniciar la página
    window.addEventListener("DOMContentLoaded", loadProjects);
  </script>
</body>
</html>
